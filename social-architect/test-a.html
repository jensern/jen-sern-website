<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test A</title>
</head>
<body style="margin:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;">
  <p style="color:#fff;font-family:sans-serif;margin-bottom:1rem;">Test A — ring animation</p>
  <canvas id="c" width="400" height="280" style="background:#0a0a1a;border-radius:8px;display:block;"></canvas>
  <script>
  var canvas=document.getElementById('c');
  var ctx=canvas.getContext('2d');
  var CX=200,CY=160,RX=140,RY=44,angle=0;
  function ring(){
    for(var i=5;i>=1;i--){
      ctx.beginPath();ctx.ellipse(CX,CY,RX+i*5,RY+i*2,0,0,Math.PI*2);
      ctx.strokeStyle='rgba(200,140,20,'+(0.05*(6-i))+')';ctx.lineWidth=8;ctx.stroke();
    }
    ctx.beginPath();ctx.ellipse(CX,CY,RX,RY,0,0,Math.PI*2);
    ctx.strokeStyle='rgba(215,160,25,0.85)';ctx.lineWidth=3;ctx.stroke();
  }
  function pulse(a){
    var x=CX+RX*Math.cos(a),y=CY+RY*Math.sin(a);
    for(var i=30;i>=1;i--){
      var f=1-i/30,px=CX+RX*Math.cos(a-i*0.04),py=CY+RY*Math.sin(a-i*0.04);
      ctx.beginPath();ctx.arc(px,py,4*f,0,Math.PI*2);
      ctx.fillStyle='rgba(255,180,30,'+(f*0.6)+')';ctx.fill();
    }
    var g=ctx.createRadialGradient(x,y,0,x,y,25);
    g.addColorStop(0,'rgba(255,220,80,0.9)');g.addColorStop(1,'rgba(255,140,0,0)');
    ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle='#FFD040';ctx.fill();
  }
  function frame(){requestAnimationFrame(frame);ctx.clearRect(0,0,400,280);angle+=0.018;ring();pulse(angle);}
  frame();
  </script>
</body>
</html>
